name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"     # Mondays: a vulnerability published for a package we use shows up even when nobody pushed
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  audit:
    # Known vulnerabilities in what the server installs (requirements.txt, as the Dockerfile does). Not a condition of the deploy job: a
    # new advisory for a package should be seen and fixed, but must not stop an unrelated fix from going out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
  deploy:
    # Runs only after the tests pass and only for a push to main in the public repository (komplettsystem/jd-to-cv): that push is the owner's decision to deploy. The private working repository runs the tests only. The "production" environment limits it to main and can take a required reviewer.
    needs: pytest
    if: github.repository == 'komplettsystem/jd-to-cv' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Upload the files and restart the app
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          git archive --format=tar HEAD | ssh -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Check that the site answers
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$DEPLOY_URL" -o /dev/null
